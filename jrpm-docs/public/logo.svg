<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="OpenTTD-JRPM">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f3a"/>
      <stop offset="0.55" stop-color="#0e6db4"/>
      <stop offset="1" stop-color="#00b7ff"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e6f3"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe0ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fe0ff"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- speed lines (left, trailing) -->
  <g stroke="url(#glow)" stroke-linecap="round">
    <line x1="4" y1="24" x2="18" y2="24" stroke-width="1.6"/>
    <line x1="2" y1="29" x2="14" y2="29" stroke-width="1.6"/>
    <line x1="6" y1="34" x2="16" y2="34" stroke-width="1.6"/>
  </g>

  <!-- streamlined train body (side view, nose to the right) -->
  <path d="M16 22 H36 Q44 22 50 30 Q52 32 50 34 Q44 42 36 42 H16 Z" fill="url(#body)"/>

  <!-- cyan windshield / window -->
  <path d="M30 25 H36 Q41 25 44 29 L46 31 L30 31 Z" fill="#00d4ff"/>

  <!-- nose headlight -->
  <circle cx="48.5" cy="32" r="1.7" fill="#aef2ff"/>

  <!-- under-body shadow stripe -->
  <rect x="16" y="38" width="30" height="1.6" fill="#0b1f3a" opacity="0.18"/>

  <!-- JRPM wordmark -->
  <text x="32" y="58"
        font-family="-apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
        font-size="11" font-weight="800" letter-spacing="1.4"
        fill="#ffffff" text-anchor="middle">JRPM</text>
</svg>