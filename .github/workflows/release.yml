name: Release

on:
  push:
    tags:
    - '*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (for Pull Requests, use refs/pull/NNN/head)'
        required: true
#  repository_dispatch:
#    # client_payload should be the same as the inputs for workflow_dispatch.
#    types:
#    - Build*
#  release:
#    types:
#    - published

jobs:
  source:
    name: Source

    uses: ./.github/workflows/release-source.yml
    secrets: inherit

  docs:
    name: Docs
    needs: source

    uses: ./.github/workflows/release-docs.yml
    secrets: inherit

    with:
      version: ${{ needs.source.outputs.version }}

  linux:
    name: Linux (Generic)
    needs: source

    uses: ./.github/workflows/release-linux.yml
    secrets: inherit

    with:
      version: ${{ needs.source.outputs.version }}
      survey_key: ${{ needs.source.outputs.survey_key }}

  linux_distros:
    name: Linux (Distros)
    needs: source

    uses: ./.github/workflows/release-linux-distros.yml
    secrets: inherit

    with:
      version: ${{ needs.source.outputs.version }}
      survey_key: ${{ needs.source.outputs.survey_key }}

  linux-dedicated:
    name: Linux (Dedicated)
    needs: source

    uses: ./.github/workflows/release-linux-dedicated.yml
    secrets: inherit

    with:
      version: ${{ needs.source.outputs.version }}
      survey_key: ${{ needs.source.outputs.survey_key }}

  macos:
    name: MacOS
    needs: source

    uses: ./.github/workflows/release-macos.yml
    secrets: inherit

    with:
      version: ${{ needs.source.outputs.version }}
      survey_key: ${{ needs.source.outputs.survey_key }}

  windows:
    name: Windows
    needs: source

    uses: ./.github/workflows/release-windows.yml
    secrets: inherit

    with:
      is_tag: ${{ needs.source.outputs.is_tag }}
      version: ${{ needs.source.outputs.version }}
      survey_key: ${{ needs.source.outputs.survey_key }}

  android:
    name: Android (APK)
    needs: source

    uses: ./.github/workflows/android.yml
    secrets: inherit

  publish:
    name: Publish to GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    # Deliberately does not wait for `android`: the APK is produced by pelya's
    # commandergenius packaging template, which currently fails to link ICU
    # (undefined icu_62 symbols) on a cold build. That is an upstream packaging
    # problem rather than a jrpm build failure, and it must not hold back the
    # desktop releases. Android still runs and uploads its artifact; the APK can
    # be attached to the release manually once the template builds again.
    needs: [source, docs, linux, linux_distros, linux-dedicated, macos, windows]

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download all build artifacts
      uses: actions/download-artifact@v8
      with:
        pattern: openttd-*
        merge-multiple: true

    - name: Publish release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: ${{ github.ref_name }}
        files: openttd-*
