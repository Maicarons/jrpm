name: CI (MinGW)

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      msystem:
        required: true
        type: string

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  mingw:
    name: CI

    runs-on: windows-latest

    steps:
    - name: Checkout
      if: github.event_name != 'workflow_dispatch'
      uses: actions/checkout@v7

    - name: Checkout (Manual)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.ref }}

    - name: Setup MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ${{ inputs.msystem }}
        release: false
        install: >-
          git
          make
        pacboy: >-
          cmake:p
          gcc:p
          lzo2:p
          libpng:p
          lld:p
          ninja:p
          libogg:p
          opus:p
          opusfile:p

    - name: Install OpenGFX
      shell: bash
      run: |
        mkdir -p "C:/Users/Public/Documents/OpenTTD/baseset"
        cd "C:/Users/Public/Documents/OpenTTD/baseset"

        echo "::group::Download OpenGFX"
        curl -L https://cdn.openttd.org/opengfx-releases/0.6.0/opengfx-0.6.0-all.zip -o opengfx-all.zip
        echo "::endgroup::"

        echo "::group::Unpack OpenGFX"
        unzip opengfx-all.zip
        # opengfx-0.6.0-all.zip only wraps opengfx-0.6.0.tar; extract it so the .grf baseset files exist
        tar xf opengfx-0.6.0.tar
        # Flatten if the tarball extracted into a subfolder (OpenTTD scans the baseset dir directly)
        if [ -d opengfx-0.6.0 ]; then
          mv opengfx-0.6.0/* . 2>/dev/null || true
          rmdir opengfx-0.6.0 2>/dev/null || true
        fi
        echo "::endgroup::"

        rm -f opengfx-all.zip opengfx-0.6.0.tar

    - name: Install GCC problem matcher
      uses: ammaraskar/gcc-problem-matcher@master

    - name: Build
      shell: msys2 {0}
      env:
        NINJA_STATUS: "[%f/%t -- %e] " # [finished_edges/total_edges -- elapsed_time], default value is "[%f/%t] "
      run: |
        mkdir build
        cd build

        echo "::group::CMake"
        cmake .. \
          -GNinja \
          -DCMAKE_CXX_FLAGS="-fuse-ld=lld" \
          -DOPTION_NO_WARN_UNINIT=1 \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        cmake --build . --target all openttd_test
        echo "::endgroup::"

    - name: Test
      shell: msys2 {0}
      run: |
        cd build
        ctest --timeout 120
