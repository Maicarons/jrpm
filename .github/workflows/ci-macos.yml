name: CI (MacOS)

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      full_arch:
        required: true
        type: string
      extra-cmake-parameters:
        required: false
        type: string
        default: ""

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  macos:
    name: CI

    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: 10.15

    steps:
    - name: Setup Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Checkout
      if: github.event_name != 'workflow_dispatch'
      uses: actions/checkout@v7

    - name: Checkout (Manual)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.inputs.ref }}

    - name: Setup vcpkg
      id: vcpkg
      uses: OpenTTD/actions/setup-vcpkg@v6

    - name: Install OpenGFX
      run: |
        mkdir -p ~/Documents/OpenTTD/baseset build/baseset
        cd build/baseset

        echo "::group::Download OpenGFX"
        curl -L https://cdn.openttd.org/opengfx-releases/0.6.0/opengfx-0.6.0-all.zip -o opengfx-all.zip
        echo "::endgroup::"

        echo "::group::Unpack OpenGFX"
        unzip opengfx-all.zip
        # opengfx-0.6.0-all.zip only wraps opengfx-0.6.0.tar; extract it so the .grf baseset files exist
        tar xf opengfx-0.6.0.tar
        # Flatten if the tarball extracted into a subfolder (OpenTTD scans the baseset dir directly)
        if [ -d opengfx-0.6.0 ]; then
          mv opengfx-0.6.0/* . 2>/dev/null || true
          rmdir opengfx-0.6.0 2>/dev/null || true
        fi
        echo "::endgroup::"

        rm -f opengfx-all.zip opengfx-0.6.0.tar
        # Mirror into the personal data dir OpenTTD also scans for basesets
        cp -r ./* ~/Documents/OpenTTD/baseset/ 2>/dev/null || true

    - name: Install GCC problem matcher
      uses: ammaraskar/gcc-problem-matcher@master

    - name: Build
      run: |
        mkdir build
        cd build

        echo "::group::CMake"
        cmake .. \
          -DCMAKE_OSX_ARCHITECTURES=${{ inputs.full_arch }} \
          -DVCPKG_TARGET_TRIPLET=${{ inputs.arch }}-osx \
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.vcpkg.outputs.vcpkg-cmake }} \
          ${{ inputs.extra-cmake-parameters }} \
          # EOF
        echo "::endgroup::"

        echo "::group::Build"
        echo "Running on $(sysctl -n hw.logicalcpu) cores"
        cmake --build . -j $(sysctl -n hw.logicalcpu) --target all openttd_test
        echo "::endgroup::"

    - name: Test
      run: |
        cd build
        ctest -j $(sysctl -n hw.logicalcpu) --timeout 120
